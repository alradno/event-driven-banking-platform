name: event-driven-banking-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_OPTS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
      KAFKA_GC_LOG_OPTS: "-Xlog:gc*:file=/tmp/kafkaServer-gc.log:time,tags:filecount=10,filesize=100M"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISHED_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      JAVA_OPTS_APPEND: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
    ports:
      - "${KEYCLOAK_PORT:-18089}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        MODULE: api-gateway
    environment:
      SERVER_PORT: 8080
      KEYCLOAK_ISSUER_URI: http://localhost:18089/realms/banking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      REDIS_HOST: redis
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${GATEWAY_PORT:-18080}:8080"
    depends_on:
      - keycloak
      - redis
      - customer-service
      - account-service
      - payment-service
      - audit-service
      - notification-service
      - ai-incident-assistant

  customer-service:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        MODULE: customer-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-banking}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-banking}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  account-service:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        MODULE: account-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-banking}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-banking}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  payment-service:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        MODULE: payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-banking}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-banking}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8080
    depends_on:
      - postgres
      - kafka
      - account-service

  audit-service:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        MODULE: audit-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-banking}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-banking}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        MODULE: notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEMO_NOTIFICATION_FAILURE: ${DEMO_NOTIFICATION_FAILURE:-false}
    depends_on:
      - kafka

  ai-incident-assistant:
    build:
      context: ./ai-incident-assistant
    environment:
      RUNBOOK_DIR: /app/runbooks
    ports:
      - "${AI_PORT:-18090}:8090"

  prometheus:
    image: prom/prometheus:v2.55.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "${PROMETHEUS_PORT:-19091}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "${OTEL_GRPC_PORT:-14317}:4317"
      - "${OTEL_HTTP_PORT:-14318}:4318"
    volumes:
      - ./infra/otel-collector/config.yml:/etc/otelcol/config.yml:ro
