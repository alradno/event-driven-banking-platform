spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18089/realms/banking}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:18089/realms/banking/protocol/openid-connect/certs}
  cloud:
    gateway:
      redis-rate-limiter:
        include-headers: false
      default-filters:
        - SecureHeaders
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@principalOrIpKeyResolver}"
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://customer-service:8080}
          predicates:
            - Path=/customers/**
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://account-service:8080}
          predicates:
            - Path=/accounts/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
          predicates:
            - Path=/payments/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://audit-service:8080}
          predicates:
            - Path=/audits/**
        - id: notification-demo
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
          predicates:
            - Path=/demo/**
        - id: ai-incident-assistant
          uri: ${AI_INCIDENT_ASSISTANT_URL:http://ai-incident-assistant:8090}
          predicates:
            - Path=/ai/**
          filters:
            - RewritePath=/ai/(?<segment>.*), /$\{segment}
management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${SERVER_PORT:8080}
logging:
  structured:
    format:
      console: logstash
