name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository scans
        run: make scan
      - name: Java tests
        run: ./mvnw test
      - name: AI assistant tests
        run: python -m unittest discover -s ai-incident-assistant/tests
      - name: Build images
        run: docker compose build
      - name: Compose smoke test
        run: |
          docker compose up -d
          ./scripts/smoke-test.sh
          ./scripts/e2e-test.sh
      - name: Collect logs
        if: always()
        run: docker compose logs --tail=200
      - name: Cleanup
        if: always()
        run: docker compose down -v
