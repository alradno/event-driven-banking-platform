{{- range $key, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "banking-platform.serviceName" (dict "root" $ "service" $service) }}
  labels:
    {{- include "banking-platform.serviceLabels" (dict "root" $ "service" $service) | nindent 4 }}
spec:
  type: {{ $service.service.type }}
  ports:
    - name: http
      port: {{ $service.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "banking-platform.serviceSelectorLabels" (dict "root" $ "service" $service) | nindent 4 }}
{{- end }}
{{- end }}
