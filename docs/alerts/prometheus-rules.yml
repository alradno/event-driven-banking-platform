groups:
  - name: banking-platform
    rules:
      - alert: HighGatewayErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Gateway or service error rate is elevated.
      - alert: AuthenticationSpike
        expr: sum(rate(http_server_requests_seconds_count{status=~"401|403"}[5m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Authentication or authorization failures spiked.
      - alert: KafkaLagOrDlq
        expr: sum(kafka_consumer_records_lag_max) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Kafka lag or DLQ pressure requires investigation.
